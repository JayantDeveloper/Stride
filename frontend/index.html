<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the app paint into the notch/home-indicator area;
         the CSS below then pads content back out with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7e14ff" />
    <meta name="description" content="Tasks, calendar and plans." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest for home-screen installs and needs these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stride" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Stride</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
